[global/wm]
include-file = $HOME/.config/polybar/current_theme.ini

[bar/top]
width = 100%
height = 24
padding = 0
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-left-size = 6
border-right-size = 6
border-left-color = ${colors.transparent}
border-right-color = ${colors.transparent}

border-top-size = 6
border-bottom-size = 1
border-top-color = ${colors.transparent}
border-bottom-color = ${colors.primary}
fixed-center = true

line-size = 1

module-margin = 1
modules-left = menu i3
modules-center = date
modules-right = temperature cpu memory backlight pulseaudio network

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "JetBrainsMono Nerd Font:size=14;4"


cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3
override-redirect = false