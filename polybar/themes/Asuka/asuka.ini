[module/power]
type = custom/text
label = %{A1:$HOME/.config/rofi/scripts/power.sh &:} 󰐥 %{A}
label-font = 2
label-foreground = ${colors.primary}

format = <label>


[module/menu]
type = custom/text
label = "󰀻"
label-padding = 1
label-font = 2
label-foreground = ${colors.foreground}
label-background = ${colors.primary}

format = <label>
click-left = rofi -show drun

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false

format = <label-state>

label-focused = 󰮯 %name%
label-focused-foreground = ${colors.foreground}
label-focused-overline = ${colors.primary}
label-focused-padding = 1

label-unfocused = 󰊠 %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-empty = 󰊠
label-empty-foreground = ${colors.foreground}
label-empty-background = ${colors.background}
label-empty-padding = 2

label-urgent = 󰊠
label-urgent-background = ${colors.primary}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1.0

date = %d %b
time = at %I:%M %p

date-alt = %A, %d %B
time-alt = at %I:%M %p

format =  <label>
format-foreground = ${colors.foreground}

label = %date% %time%
label-padding = 1

[module/temperature]
type = internal/temperature
interval = 1
thermal-zone = 0
warn-temperature = 75

format = <ramp><label>
format-foreground = ${colors.foreground}

label = %temperature-c%
label-padding = 1

format-warn = <ramp> <label-warn>
format-warn-foreground = ${colors.primary}


label-warn = %temperature-c%
label-warn-foreground = ${colors.primary}

ramp-0 = 
ramp-1 = 
ramp-2 = 

[module/cpu]
type = internal/cpu
interval = 2

label = %percentage:2%%
label-padding = 1

format = 󰍛<label>
format-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2

label = %gb_used%

format =  <label>
format-padding = 1
format-foreground = ${colors.foreground}


[module/backlight]
type = internal/backlight

; Use the card name found in /sys/class/backlight/
card = intel_backlight

use-actual-brightness = true
enable-scroll = true

label = %percentage%%

format = 󰃟 <label>
format-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio

# format
label-volume = %percentage%%
format-volume = <ramp-volume><label-volume>
format-volume-padding = 1
format-volume-foreground = ${colors.foreground}

# Volume icon
ramp-volume-0 = "󰕿 "
ramp-volume-1 = "󰖀 "
ramp-volume-2 = "󰕾 "

# Muted
label-muted = " "
format-muted = <label-muted>
format-muted-padding = 1
format-muted-foreground = ${colors.primary}

[module/systray]
type = internal/tray
tray-position = right
tray-padding = 8
tray-size = 60%
tray-scale = 1.0

[module/network]
type = internal/network
; Find your interface name using the `ip link` command
interface = wlp3s0
interval = 3.0
accumulate-stats = true
unknown-as-up = true

; Click action calls nmcli or interactive tools inside raw formatting tags
label-connected = %{A1:$HOME/.config/rofi/scripts/nmcli.sh &:} %{A}
label-connected-padding = 1
label-connected-foreground = ${colors.foreground}
label-connected-background = ${colors.primary}

; Formatting when connected to a network
format-connected = <label-connected>

label-disconnected = %{A1:$HOME/.config/rofi/scripts/nmcli.sh &:}󰖪 %{A}
label-disconnected-padding = 1
label-disconnected-foreground = ${colors.primary}
label-disconnected-background = ${colors.foreground}

; Formatting when disconnected
format-disconnected = <label-disconnected>
